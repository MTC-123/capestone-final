name: Preview E2E

# Runs the live end-to-end suite against every Vercel preview once it is
# ready, so a pull request shows whether the deployed app actually works
# (auth, RBAC, every route, WCAG 2.2 AA, phone and RTL layouts) before merge.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: preview-e2e-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  live:
    name: Live E2E on preview
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Previews sit behind Vercel Deployment Protection; without the bypass
      # secret the suite cannot reach them, so it is skipped rather than failed.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Bypass secret configured?
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET == ''
        working-directory: ${{ github.workspace }}
        run: echo "::notice::Set the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to run the live suite on previews."
      - uses: actions/checkout@v4
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
      - run: npx playwright install --with-deps chromium webkit
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
      - name: Run live suite (desktop, phone, Arabic RTL)
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
        run: npx playwright test tests/e2e/live --project=chromium --project=iphone-14 --project=arabic-rtl
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
