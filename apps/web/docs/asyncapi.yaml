asyncapi: 2.6.0
info:
  title: RICER Mapping Streams
  version: 1.0.0
channels:
  /api/map/batch:
    description: NDJSON streaming responses for batch mapping requests.
    publish:
      message:
        name: BatchRequest
        payload:
          type: object
          properties:
            requests:
              type: array
              maxItems: 500
              items:
                type: object
    subscribe:
      message:
        name: BatchResponseLine
        payload:
          type: object
          properties:
            id:
              type: string
            ok:
              type: boolean
            kind:
              type: string
            url:
              type: string
            data:
              type: object
            error:
              type: string
