replicaCount: 2

image:
  repository: ricer/web
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

rollout:
  enabled: true
  canary:
    maxSurge: 25%
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause: { duration: 30m }
      - setWeight: 100

env:
  NODE_ENV: production
